name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        extra: ["dev", "dev,gcs"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[${{ matrix.extra }}]"
      - name: Compile
        run: python -m compileall -q apps packages
      - name: Test
        shell: bash
        run: |
          if [[ "${{ matrix.extra }}" == "dev" ]]; then
            python -m pytest -q -m "not gcs"
          else
            python -m pytest -q -m "gcs"
          fi
